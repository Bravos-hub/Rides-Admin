name: Deploy (Admin Web)

on:
  workflow_call:

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/evzone/admin
  APP_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify deployment settings
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          API_DOMAIN: ${{ vars.APP_DOMAIN }}
          APP_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
          DEPLOY_KEY: ${{ secrets.DO_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.DO_SSH_FINGERPRINT }}
        run: |
          for name in DEPLOY_HOST API_DOMAIN APP_DOMAIN DEPLOY_KEY SSH_FINGERPRINT; do
            if [ -z "${!name}" ]; then echo "Missing deployment setting: $name" >&2; exit 1; fi
          done

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (pointing at the production API)
        run: npm run build
        env:
          VITE_BACKEND_BASE_URL: https://${{ vars.APP_DOMAIN }}
          VITE_API_BASE_URL: https://${{ vars.APP_DOMAIN }}
          VITE_SOCKET_BASE_URL: wss://${{ vars.APP_DOMAIN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload build & deploy artifacts
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ env.APP_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "dist"
          target: ${{ env.DEPLOY_DIR }}/release
          rm: true
          overwrite: true
          fingerprint: ${{ secrets.DO_SSH_FINGERPRINT }}

      - name: Run remote deployment
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ env.APP_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          fingerprint: ${{ secrets.DO_SSH_FINGERPRINT }}
          script: |
            set -eu
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            SITE_DIR="$DEPLOY_DIR/site"
            RELEASE_DIR="$SITE_DIR/releases/${{ github.sha }}"
            test -s "$DEPLOY_DIR/release/dist/index.html"
            mkdir -p "$RELEASE_DIR"
            cp -a "$DEPLOY_DIR/release/dist/." "$RELEASE_DIR/"
            test -s "$RELEASE_DIR/index.html"
            ln -sfn "releases/${{ github.sha }}" "$SITE_DIR/.current-next"
            mv -Tf "$SITE_DIR/.current-next" "$SITE_DIR/current"
